# Quarkus's Vert.x HTTP server hosts the proxy routes on port 8080.
quarkus.http.port=8080
quarkus.banner.enabled=false

# Upstream Smithy server (the sibling examples/quarkus-server). Override
# at runtime with -Dcoffee-shop.upstream-endpoint=... to point elsewhere.
coffee-shop.upstream-endpoint=http://localhost:8888
