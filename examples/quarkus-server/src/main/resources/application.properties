# Two HTTP listeners run side by side in this app:
#
#   - Smithy-Java's Netty server on http://localhost:8888 (handled by
#     CoffeeShopServerConfig). Serves the Smithy operations.
#   - Quarkus's Vert.x server on http://localhost:8080. Hosts management
#     endpoints (/q/health, /q/metrics, …) when those extensions are added.
#
# Pinned the Quarkus port to 8080 so it does not collide with 8888.
quarkus.http.port=8080

quarkus.banner.enabled=false
